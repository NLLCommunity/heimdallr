# fly.toml app configuration file generated for heimdallr on 2026-08-31T12:36:20+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'heimdallr'
primary_region = 'ord'
kill_signal = 'SIGTERM'
kill_timeout = '1m0s'

[build]
[[mounts]]
  source = 'heimdallr'
  destination = '/var/lib/heimdallr'

[http_service]
  internal_port = 8484
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
