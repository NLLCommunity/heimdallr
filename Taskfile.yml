# https://taskfile.dev

version: "3"

env:
  GOTOOLCHAIN: auto
vars:
  binary: heimdallrBot{{exeExt}}
  extraBuildFlags: '-a -installsuffix cgo -ldflags "-s -w"'

tasks:
  test:editors:
    desc: Test explicit-message editor state (requires Node.js)
    cmds:
      - node web/tests/post-editor.test.cjs
  test:editors:browser:
    desc: Test the Lit integration in Chromium (see web/tests/README.md for setup)
    cmds:
      - node web/tests/browser.test.cjs
  components:update:
    desc: Vendor a pinned standalone editor bundle (VERSION=x.y.z; defaults to the recorded version)
    env:
      COMPONENTS_VERSION: '{{.VERSION | default ""}}'
    preconditions:
      - sh: command -v node
        msg: "Node.js 22+ is required to update the editor bundle"
      - sh: command -v curl
        msg: "curl is required to download the editor bundle"
    cmds:
      - node --experimental-vm-modules scripts/update-components.mjs
  default:
    desc: Build and run heimdallr
    cmds:
      - task: debug
  debug:
    desc: Build and run heimdallr with debug flags
    cmds:
      - task: build
        vars:
          extraBuildFlags: '-gcflags "all=-N -l"'
      - task: run
  run:
    desc: Run heimdallr
    preconditions:
      - sh: test -f ./{{.binary}}
        msg: "heimdallr binary not found, please run 'task build' first"
    cmds:
      - ./{{.binary}}
  build:
    desc: Build heimdallr binary
    cmds:
      - task: generate
      - >
        go build {{.extraBuildFlags}}
        -o {{.binary}}
        github.com/NLLCommunity/heimdallr
  generate:
    desc: Generate code
    preconditions:
      - sh: command -v templ
        msg: "templ not found, please install templ first. https://www.github.com/a-h/templ"
    cmds:
      - templ generate
      - go generate ./...
